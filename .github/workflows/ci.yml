name: CI

# Runs the same checks as scripts/test.ps1 on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check --settings=config.settings_test
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests
        run: python manage.py test --settings=config.settings_test

  ml:
    name: ML (features, data rules, inference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # PyTorch is not needed for these tests (the model-shape test skips itself without it).
      - run: pip install numpy scipy soundfile onnxruntime
      - run: python -m unittest discover -s voice/tests -t . -v

  mobile:
    name: Mobile (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/check-secrets.ps1
